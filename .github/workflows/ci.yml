name: Plugin source validation

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the dual plugin manifests
        run: |
          test -f plugins/com.xsec.system-terminal/plugin.json
          test -f plugins/com.xsec.system-terminal/.codex-plugin/plugin.json
      - name: Validate the terminal frontend contract
        run: |
          node --check plugins/com.xsec.system-terminal/com.xsec.desktop/frontend/index.js
          python3 -m unittest discover -s tests -p 'test_*.py'
